workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

stages:
  - format
  - build
  - test

clang-format:
  stage: format
  image: alpine:latest
  before_script:
    - apk add --no-cache clang-extra-tools
  script:
    - clang-format --version
    - FILES=$(find . -name "*.[ch]")
    - echo "Running clang-format on the following files:"
    - echo "$FILES"
    - clang-format --dry-run -Werror $FILES

newlines:
  stage: format
  image: alpine:latest
  before_script:
    - apk add --no-cache make
  script:
    - make format-newline

build-all:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache make gcc g++ libc-dev cmake
  script:
    - make release
  artifacts:
    paths:
      - build/release/src/distributed-database/databasenode
      - build/release/src/distributed-database/dbtest
      - build/release/src/distributed-database/networkingtest
    expire_in: 1 hour

include-what-you-use-check:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache include-what-you-use libc-dev make
  script:
    - make iwyu
